name: 票數追蹤

on:
  # 活動已於 10/1 00:00 結束，排程已移除，只保留手動執行。
  # schedule:
  #   - cron: "23 * * * *"
  #   - cron: "53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vote-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 還原歷史資料
        run: python kt_tracker.py ingest --dir data

      # 活動結束，不再抓取新資料
      # - name: 抓一次快照
      #   timeout-minutes: 10
      #   run: python kt_tracker.py snap --soft-fail
      # - name: 記錄變動
      #   run: python kt_tracker.py emit --dir data

      - name: 產生定格報表
        run: python kt_tracker.py report --me "${{ vars.MY_ENTRY }}" --target "${{ vars.TARGET_RANK || 10 }}" --rivals "${{ vars.RIVALS }}" --until "2026-10-01 01:00" --out docs/index.html

      - name: 存回 repo
        run: |
          git config user.name "vote-tracker"
          git config user.email "actions@github.com"
          git add data docs
          git diff --staged --quiet || git commit -m "final report $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git push
